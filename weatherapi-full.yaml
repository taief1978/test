openapi: 3.0.0
info:
  title: WeatherAPI.com - Full API
  version: 1.0.1
  description: Spec complète (avec tags et operationId pour Collate/OpenMetadata)
servers:
  - url: http://api.weatherapi.com/v1

tags:
  - name: Current
    description: Endpoints de météo actuelle
  - name: Forecast
    description: Endpoints de prévisions
  - name: Marine
    description: Endpoints de météo marine
  - name: History
    description: Endpoints d'historique
  - name: Astronomy
  - name: Alerts
  - name: Search
  - name: Sports
  - name: Timezone
  - name: Future
  - name: IP

paths:
  /current.json:
    get:
      operationId: getCurrentWeather
      tags: [Current]
      summary: Current Weather
      parameters:
        - in: query
          name: key
          required: true
          schema: { type: string }
        - in: query
          name: q
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK }

  /forecast.json:
    get:
      operationId: getForecast
      tags: [Forecast]
      summary: Weather Forecast
      parameters:
        - in: query
          name: key
          required: true
          schema: { type: string }
        - in: query
          name: q
          required: true
          schema: { type: string }
        - in: query
          name: days
          required: false
          schema: { type: integer, minimum: 1, maximum: 14 }
      responses:
        '200': { description: OK }

  /marine.json:
    get:
      operationId: getMarineWeather
      tags: [Marine]
      summary: Marine Weather
      parameters:
        - in: query
          name: key
          required: true
          schema: { type: string }
        - in: query
          name: q
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK }

  /history.json:
    get:
      operationId: getWeatherHistory
      tags: [History]
      summary: Weather History
      parameters:
        - in: query
          name: key
          required: true
          schema: { type: string }
        - in: query
          name: q
          required: true
          schema: { type: string }
        - in: query
          name: dt
          required: true
          schema: { type: string, format: date }
      responses:
        '200': { description: OK }