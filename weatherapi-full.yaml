openapi: 3.0.0
info:
  title: WeatherAPI.com - Full API
  version: 1.0.0
  description: >
    Spécification complète WeatherAPI.com incluant tous les endpoints :
    current, forecast, history, marine, astronomy, alerts, search,
    sports, timezone, future et ip lookup.
servers:
  - url: http://api.weatherapi.com/v1

paths:

  /current.json:
    get:
      summary: Current Weather
      parameters:
        - in: query
          name: key
          required: true
          schema: { type: string }
        - in: query
          name: q
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK }

  /forecast.json:
    get:
      summary: Weather Forecast
      parameters:
        - in: query
          name: key
          required: true
          schema: { type: string }
        - in: query
          name: q
          required: true
          schema: { type: string }
        - in: query
          name: days
          required: false
          schema: { type: integer, minimum: 1, maximum: 14 }
      responses:
        '200': { description: OK }

  /history.json:
    get:
      summary: Weather History
      parameters:
        - in: query
          name: key
          required: true
          schema: { type: string }
        - in: query
          name: q
          required: true
          schema: { type: string }
        - in: query
          name: dt
          required: true
          schema: { type: string, format: date }
      responses:
        '200': { description: OK }

  /marine.json:
    get:
      summary: Marine Weather
      parameters:
        - in: query
          name: key
          required: true
          schema: { type: string }
        - in: query
          name: q
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK }

  /astronomy.json:
    get:
      summary: Astronomy Data
      parameters:
        - in: query
          name: key
          required: true
          schema: { type: string }
        - in: query
          name: q
          required: true
          schema: { type: string }
        - in: query
          name: dt
          required: false
          schema: { type: string, format: date }
      responses:
        '200': { description: OK }

  /alerts.json:
    get:
      summary: Weather Alerts
      parameters:
        - in: query
          name: key
          required: true
          schema: { type: string }
        - in: query
          name: q
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK }

  /search.json:
    get:
      summary: Search Locations
      parameters:
        - in: query
          name: key
          required: true
          schema: { type: string }
        - in: query
          name: q
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK }

  /sports.json:
    get:
      summary: Sports Weather
      parameters:
        - in: query
          name: key
          required: true
          schema: { type: string }
        - in: query
          name: q
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK }

  /timezone.json:
    get:
      summary: Timezone Lookup
      parameters:
        - in: query
          name: key
          required: true
          schema: { type: string }
        - in: query
          name: q
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK }

  /future.json:
    get:
      summary: Future Weather
      parameters:
        - in: query
          name: key
          required: true
          schema: { type: string }
        - in: query
          name: q
          required: true
          schema: { type: string }
        - in: query
          name: dt
          required: true
          schema: { type: string, format: date }
      responses:
        '200': { description: OK }

  /ip.json:
    get:
      summary: IP Lookup
      parameters:
        - in: query
          name: key
          required: true
          schema: { type: string }
        - in: query
          name: q
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK }